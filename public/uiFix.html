<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard E-GBHM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
       <!-- Link to the external JavaScript file -->
    <script src="index.js" defer></script>
    <style>
        .mobile-warning {
            display: none;
        }
        .dashboard-content {
            display: block;
        }
          .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #000;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
          100: "#657C6A",
          80: "#708876",
          60: "#8A9F8F",
          40: "#A2B5A5",
        },
        secondary: {
          100: "#A2B9A7",
          80: "#C2D0C3",
          60: "#D0DBD0",
          40: "#DEE5DD",
        },
        failed: {
          100: "#B71C1C",
          80: "#C54949",
          60: "#D47777",
          40: "#E2A4A4",
        },
        pending: {
          100: "#F9A825",
          80: "#FAB951",
          60: "#FBCB7C",
          40: "#FDDCA8",
        },
        success: {
          100: "#388E3C",
          80: "#60A563",
          60: "#88B88A",
          40: "#AFD2B1",
        },
        base: {
          100: "#000000",
          80: "#979797",
          60: "#A0A0A2",
          40: "#A8A8A9",
          0: "#FFFFFF",
        },
        body : {
        100 : "#262626"
        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-body-100 h-10 text-white" >
    
 

<!-- Scan Bottom Navigation -->
<nav id="scan-nav" class="fixed bottom-0 left-0 right-0 flex justify-between items-center">
    <ul class="w-full flex justify-between items-center ml-3 mr-3">
        <!-- Scan Button -->
        <li class=" nav-item max-w-20 text-base-0 flex flex-col items-center w-full p-2 rounded-t-lg cursor-pointer active" id="scanQr">
            <iconify-icon icon="lucide:scan" height="23"></iconify-icon>
            <p>Scan</p>
        </li>

        <!-- Profile Button -->
        <li class="nav-item max-w-20 text-base-0 flex flex-col items-center w-full p-2 rounded-t-lg cursor-pointer" id="showQr">
            <iconify-icon icon="lucide:qr-code" height="23"></iconify-icon>
            <p>Barcode</p>
        </li>
    </ul>
</nav>





  

</body>
</html>
